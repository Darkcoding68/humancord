<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anonim Chat</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #111118;
            border-right: 1px solid #292933;
            padding: 20px;
            overflow-y: auto;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .username {
            background: #191922;
            border: 1px solid #292933;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .users-title {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #users {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #17171f;
            border: 1px solid #292933;
            padding: 10px;
            border-radius: 10px;
        }

        .user-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-buttons {
            display: flex;
            gap: 5px;
        }

        .user-buttons button {
            border: 0;
            background: #292934;
            color: white;
            border-radius: 7px;
            padding: 7px;
            cursor: pointer;
        }

        .user-buttons button:hover {
            background: #3b3b49;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 65px;
            background: #111118;
            border-bottom: 1px solid #292933;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 14px;
            max-width: 80%;
        }

        .message-user {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .message-text {
            display: inline-block;
            background: #191922;
            border: 1px solid #292933;
            padding: 10px 13px;
            border-radius: 12px;
            word-break: break-word;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #292933;
            background: #111118;
        }

        #messageInput {
            flex: 1;
            background: #191922;
            border: 1px solid #292933;
            color: white;
            border-radius: 10px;
            padding: 13px;
            outline: none;
        }

        #sendButton {
            border: 0;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .overlay.show {
            display: flex;
        }

        .call-box {
            width: min(900px, 94vw);
            background: #111118;
            border: 1px solid #292933;
            border-radius: 18px;
            padding: 20px;
        }

        .call-title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .videos {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #050505;
            border-radius: 14px;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #050505;
        }

        #localVideo {
            position: absolute;
            right: 15px;
            bottom: 15px;
            width: 180px;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid white;
            background: #050505;
            z-index: 5;
        }

        #remoteAudio {
            display: none;
        }

        #remotePlaceholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 20px;
            z-index: 1;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .control-button,
        .hangup-button {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .control-button {
            background: #292934;
        }

        .control-button:hover {
            background: #3b3b49;
        }

        .control-button.disabled {
            opacity: 0.5;
        }

        .hangup-button {
            background: #ed4245;
        }

        .incoming-box {
            width: min(400px, 90vw);
            background: #111118;
            border: 1px solid #292933;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
        }

        .incoming-name {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .incoming-type {
            color: #aaa;
            margin-bottom: 20px;
        }

        .incoming-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .accept-button,
        .reject-button {
            border: 0;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .accept-button {
            background: #23a55a;
        }

        .reject-button {
            background: #ed4245;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 210px;
            }

            #localVideo {
                width: 120px;
                right: 8px;
                bottom: 8px;
            }
        }

        @media (max-width: 550px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ANONIM
        </div>

        <div class="username">
            👤 {{ username }}
        </div>

        <div class="users-title">
            ÇEVRİMİÇİ KULLANICILAR
        </div>

        <div id="users"></div>

    </aside>

    <main class="main">

        <div class="header">
            Anonim Sohbet
        </div>

        <div id="messages"></div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Mesaj yaz..."
                maxlength="500"
                autocomplete="off"
            >

            <button id="sendButton">
                Gönder
            </button>

        </div>

    </main>

</div>


<div id="incomingOverlay" class="overlay">

    <div class="incoming-box">

        <div
            id="incomingName"
            class="incoming-name"
        >
            Kullanıcı
        </div>

        <div
            id="incomingType"
            class="incoming-type"
        >
            Arama geliyor...
        </div>

        <div class="incoming-buttons">

            <button
                id="acceptButton"
                class="accept-button"
            >
                Kabul Et
            </button>

            <button
                id="rejectButton"
                class="reject-button"
            >
                Reddet
            </button>

        </div>

    </div>

</div>


<div id="callOverlay" class="overlay">

    <div class="call-box">

        <div
            id="callTitle"
            class="call-title"
        >
            Arama
        </div>

        <div class="videos">

            <div id="remotePlaceholder">
                Bağlantı bekleniyor...
            </div>

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

        </div>

        <audio
            id="remoteAudio"
            autoplay
        ></audio>

        <div class="controls">

            <button
                id="micButton"
                class="control-button"
            >
                🎤 Mikrofon
            </button>

            <button
                id="cameraButton"
                class="control-button"
            >
                📷 Kamera
            </button>

            <button
                id="screenButton"
                class="control-button"
            >
                🖥️ Ekran
            </button>

            <button
                id="hangupButton"
                class="hangup-button"
            >
                ☎️ Kapat
            </button>

        </div>

    </div>

</div>


<script>

const socket = io();

const username = {{ username|tojson }};

const usersElement =
    document.getElementById("users");

const messagesElement =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const incomingOverlay =
    document.getElementById("incomingOverlay");

const incomingName =
    document.getElementById("incomingName");

const incomingType =
    document.getElementById("incomingType");

const acceptButton =
    document.getElementById("acceptButton");

const rejectButton =
    document.getElementById("rejectButton");

const callOverlay =
    document.getElementById("callOverlay");

const callTitle =
    document.getElementById("callTitle");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const remoteAudio =
    document.getElementById("remoteAudio");

const remotePlaceholder =
    document.getElementById("remotePlaceholder");

const micButton =
    document.getElementById("micButton");

const cameraButton =
    document.getElementById("cameraButton");

const screenButton =
    document.getElementById("screenButton");

const hangupButton =
    document.getElementById("hangupButton");


let peerConnection = null;

let localStream = null;

let screenStream = null;

let cameraTrack = null;

let screenTrack = null;

let videoSender = null;

let currentTarget = null;

let currentCallType = null;

let incomingCall = null;

let micEnabled = true;

let cameraEnabled = true;

let sharingScreen = false;

let pendingCandidates = [];

let remoteStream = null;


const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        }

    ]

};


function addMessage(
    messageUsername,
    message
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";

    const user =
        document.createElement("div");

    user.className =
        "message-user";

    user.textContent =
        messageUsername;

    const text =
        document.createElement("div");

    text.className =
        "message-text";

    text.textContent =
        message;

    wrapper.appendChild(user);

    wrapper.appendChild(text);

    messagesElement.appendChild(wrapper);

    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


function renderUsers(users) {

    usersElement.innerHTML = "";

    users.forEach(user => {

        if (user.sid === socket.id) {
            return;
        }

        const row =
            document.createElement("div");

        row.className =
            "user";

        const name =
            document.createElement("div");

        name.className =
            "user-name";

        name.textContent =
            user.username;

        const buttons =
            document.createElement("div");

        buttons.className =
            "user-buttons";

        const voiceButton =
            document.createElement("button");

        voiceButton.textContent =
            "📞";

        voiceButton.title =
            "Sesli ara";

        voiceButton.onclick =
            () => startCall(
                user.sid,
                "audio"
            );

        const videoButton =
            document.createElement("button");

        videoButton.textContent =
            "🎥";

        videoButton.title =
            "Görüntülü ara";

        videoButton.onclick =
            () => startCall(
                user.sid,
                "video"
            );

        buttons.appendChild(
            voiceButton
        );

        buttons.appendChild(
            videoButton
        );

        row.appendChild(name);

        row.appendChild(buttons);

        usersElement.appendChild(row);

    });

}


socket.on(
    "user_list",
    users => {

        renderUsers(users);

    }
);


socket.on(
    "message",
    data => {

        addMessage(
            data.username,
            data.message
        );

    }
);


async function getMedia(video) {

    const constraints = {

        audio: {

            echoCancellation: true,

            noiseSuppression: true,

            autoGainControl: true

        },

        video: video
            ? {
                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                },

                facingMode: "user"
            }
            : false

    };

    console.log(
        "MEDIA İSTENİYOR:",
        constraints
    );

    return navigator.mediaDevices.getUserMedia(
        constraints
    );

}


function createPeerConnection() {

    console.log(
        "PEER CONNECTION OLUŞTURULUYOR"
    );

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );

    pendingCandidates = [];

    remoteStream =
        new MediaStream();

    remoteVideo.srcObject =
        remoteStream;

    remoteAudio.srcObject =
        remoteStream;


    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                console.log(
                    "LOCAL TRACK EKLENİYOR:",
                    track.kind
                );

                const sender =
                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                if (
                    track.kind === "video"
                ) {

                    videoSender =
                        sender;

                }

            });

    }


    peerConnection.ontrack =
        event => {

            console.log(
                "REMOTE TRACK GELDİ:",
                event.track.kind,
                event.track.readyState
            );

            if (
                !remoteStream.getTracks()
                    .some(
                        track =>
                            track.id ===
                            event.track.id
                    )
            ) {

                remoteStream.addTrack(
                    event.track
                );

            }

            if (
                event.track.kind ===
                "video"
            ) {

                remoteVideo.style.display =
                    "block";

                remotePlaceholder.style.display =
                    "none";

                remoteVideo.play()
                    .then(
                        () => {

                            console.log(
                                "REMOTE VIDEO OYNATILIYOR"
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "REMOTE VIDEO PLAY HATASI:",
                                error
                            );

                        }
                    );

            }

            if (
                event.track.kind ===
                "audio"
            ) {

                remoteAudio.play()
                    .then(
                        () => {

                            console.log(
                                "REMOTE AUDIO OYNATILIYOR"
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                "REMOTE AUDIO PLAY HATASI:",
                                error
                            );

                        }
                    );

            }

        };


    peerConnection.onicecandidate =
        event => {

            if (
                event.candidate &&
                currentTarget
            ) {

                console.log(
                    "ICE GÖNDERİLİYOR"
                );

                socket.emit(
                    "ice_candidate",
                    {
                        target:
                            currentTarget,

                        candidate:
                            event.candidate
                    }
                );

            }

        };


    peerConnection.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE STATE:",
                peerConnection.iceConnectionState
            );

        };


    peerConnection.onconnectionstatechange =
        () => {

            console.log(
                "CONNECTION STATE:",
                peerConnection.connectionState
            );

            if (
                peerConnection.connectionState ===
                "connected"
            ) {

                console.log(
                    "WEBRTC BAĞLANTISI KURULDU"
                );

            }

        };


    peerConnection.onsignalingstatechange =
        () => {

            console.log(
                "SIGNALING STATE:",
                peerConnection.signalingState
            );

        };

}


async function addPendingCandidates() {

    if (
        !peerConnection ||
        !peerConnection.remoteDescription
    ) {

        return;

    }

    const candidates =
        pendingCandidates;

    pendingCandidates = [];

    for (
        const candidate
        of candidates
    ) {

        try {

            await peerConnection.addIceCandidate(
                candidate
            );

            console.log(
                "BEKLEYEN ICE EKLENDİ"
            );

        } catch (error) {

            console.error(
                "BEKLEYEN ICE HATASI:",
                error
            );

        }

    }

}


async function startCall(
    target,
    type
) {

    if (peerConnection) {

        alert(
            "Zaten bir aramadasın."
        );

        return;

    }

    currentTarget =
        target;

    currentCallType =
        type;

    try {

        localStream =
            await getMedia(
                type === "video"
            );

        cameraTrack =
            localStream.getVideoTracks()[0]
            || null;

        console.log(
            "KAMERA TRACK:",
            cameraTrack
        );

        createPeerConnection();

        callTitle.textContent =
            type === "video"
                ? "Görüntülü Arama"
                : "Sesli Arama";

        callOverlay.classList.add(
            "show"
        );

        remotePlaceholder.style.display =
            "flex";

        remoteVideo.style.display =
            "none";

        cameraButton.style.display =
            type === "video"
                ? "flex"
                : "none";

        screenButton.style.display =
            type === "video"
                ? "flex"
                : "none";

        localVideo.srcObject =
            localStream;

        const offer =
            await peerConnection.createOffer();

        console.log(
            "OFFER OLUŞTURULDU"
        );

        await peerConnection.setLocalDescription(
            offer
        );

        console.log(
            "LOCAL DESCRIPTION AYARLANDI"
        );

        socket.emit(
            "call_user",
            {
                target:
                    target,

                offer:
                    peerConnection.localDescription,

                type:
                    type
            }
        );

    } catch (error) {

        console.error(
            "CALL ERROR:",
            error
        );

        cleanupCall();

        alert(
            "Arama başlatılamadı: " +
            error.message
        );

    }

}


socket.on(
    "incoming_call",
    data => {

        console.log(
            "GELEN ARAMA:",
            data.type
        );

        if (peerConnection) {

            socket.emit(
                "reject_call",
                {
                    target:
                        data.from
                }
            );

            return;

        }

        incomingCall =
            data;

        incomingName.textContent =
            data.username;

        incomingType.textContent =
            data.type === "video"
                ? "Görüntülü arama geliyor..."
                : "Sesli arama geliyor...";

        incomingOverlay.classList.add(
            "show"
        );

    }
);


acceptButton.onclick =
    async () => {

        if (!incomingCall) {
            return;
        }

        const data =
            incomingCall;

        incomingCall =
            null;

        incomingOverlay.classList.remove(
            "show"
        );

        currentTarget =
            data.from;

        currentCallType =
            data.type;

        try {

            localStream =
                await getMedia(
                    data.type === "video"
                );

            cameraTrack =
                localStream.getVideoTracks()[0]
                || null;

            console.log(
                "KABUL EDEN KAMERA:",
                cameraTrack
            );

            createPeerConnection();

            callTitle.textContent =
                data.type === "video"
                    ? "Görüntülü Arama"
                    : "Sesli Arama";

            callOverlay.classList.add(
                "show"
            );

            remotePlaceholder.style.display =
                "flex";

            remoteVideo.style.display =
                "none";

            cameraButton.style.display =
                data.type === "video"
                    ? "flex"
                    : "none";

            screenButton.style.display =
                data.type === "video"
                    ? "flex"
                    : "none";

            localVideo.srcObject =
                localStream;

            console.log(
                "REMOTE OFFER AYARLANIYOR"
            );

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );

            console.log(
                "REMOTE OFFER AYARLANDI"
            );

            await addPendingCandidates();

            const answer =
                await peerConnection.createAnswer();

            console.log(
                "ANSWER OLUŞTURULDU"
            );

            await peerConnection.setLocalDescription(
                answer
            );

            console.log(
                "LOCAL ANSWER AYARLANDI"
            );

            socket.emit(
                "answer_call",
                {
                    target:
                        currentTarget,

                    answer:
                        peerConnection.localDescription
                }
            );

        } catch (error) {

            console.error(
                "ACCEPT ERROR:",
                error
            );

            cleanupCall();

            alert(
                "Arama kabul edilemedi: " +
                error.message
            );

        }

    };


rejectButton.onclick =
    () => {

        if (!incomingCall) {
            return;
        }

        socket.emit(
            "reject_call",
            {
                target:
                    incomingCall.from
            }
        );

        incomingCall =
            null;

        incomingOverlay.classList.remove(
            "show"
        );

    };


socket.on(
    "call_answered",
    async data => {

        console.log(
            "CALL ANSWER GELDİ"
        );

        if (!peerConnection) {
            return;
        }

        try {

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );

            console.log(
                "REMOTE ANSWER AYARLANDI"
            );

            await addPendingCandidates();

        } catch (error) {

            console.error(
                "ANSWER ERROR:",
                error
            );

        }

    }
);


socket.on(
    "ice_candidate",
    async data => {

        console.log(
            "ICE GELDİ"
        );

        if (!peerConnection) {

            console.log(
                "PEER YOK, ICE ATLANDI"
            );

            return;

        }

        const candidate =
            new RTCIceCandidate(
                data.candidate
            );

        if (
            peerConnection.remoteDescription
        ) {

            try {

                await peerConnection.addIceCandidate(
                    candidate
                );

                console.log(
                    "ICE EKLENDİ"
                );

            } catch (error) {

                console.error(
                    "ICE EKLEME HATASI:",
                    error
                );

            }

        } else {

            console.log(
                "ICE BEKLETİLİYOR"
            );

            pendingCandidates.push(
                candidate
            );

        }

    }
);


socket.on(
    "call_rejected",
    () => {

        alert(
            "Arama reddedildi."
        );

        cleanupCall();

    }
);


socket.on(
    "call_ended",
    () => {

        cleanupCall();

    }
);


socket.on(
    "call_busy",
    data => {

        alert(
            data.message ||
            "Kullanıcı meşgul."
        );

        cleanupCall();

    }
);


micButton.onclick =
    () => {

        if (!localStream) {
            return;
        }

        const tracks =
            localStream.getAudioTracks();

        if (!tracks.length) {
            return;
        }

        tracks.forEach(
            track => {

                track.enabled =
                    !track.enabled;

                micEnabled =
                    track.enabled;

            }
        );

        micButton.textContent =
            micEnabled
                ? "🎤 Mikrofon"
                : "🔇 Mikrofon";

        micButton.classList.toggle(
            "disabled",
            !micEnabled
        );

    };


cameraButton.onclick =
    () => {

        if (!cameraTrack) {

            alert(
                "Bu cihazda kullanılabilir kamera bulunamadı."
            );

            return;

        }

        cameraEnabled =
            !cameraEnabled;

        cameraTrack.enabled =
            cameraEnabled;

        cameraButton.textContent =
            cameraEnabled
                ? "📷 Kamera"
                : "🚫 Kamera";

        cameraButton.classList.toggle(
            "disabled",
            !cameraEnabled
        );

    };


async function startScreenShare() {

    console.log(
        "EKRAN PAYLAŞIMI BAŞLATILIYOR"
    );

    if (
        !peerConnection ||
        currentCallType !== "video"
    ) {

        alert(
            "Ekran paylaşımı için görüntülü arama gerekli."
        );

        return;

    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ) {

        alert(
            "Tarayıcın ekran paylaşımını desteklemiyor."
        );

        return;

    }

    try {

        screenStream =
            await navigator.mediaDevices.getDisplayMedia(
                {
                    video: {
                        cursor: "always"
                    },

                    audio: false
                }
            );

        screenTrack =
            screenStream.getVideoTracks()[0];

        if (!screenTrack) {

            throw new Error(
                "Ekran video track bulunamadı."
            );

        }

        if (!videoSender) {

            videoSender =
                peerConnection
                    .getSenders()
                    .find(
                        sender =>
                            sender.track &&
                            sender.track.kind ===
                            "video"
                    );

        }

        if (!videoSender) {

            throw new Error(
                "Video sender bulunamadı."
            );

        }

        await videoSender.replaceTrack(
            screenTrack
        );

        sharingScreen =
            true;

        localVideo.srcObject =
            screenStream;

        screenButton.textContent =
            "🛑 Ekranı Durdur";

        console.log(
            "EKRAN PAYLAŞIMI BAŞLADI"
        );

        screenTrack.onended =
            async () => {

                await stopScreenShare();

            };

    } catch (error) {

        console.error(
            "EKRAN PAYLAŞMA HATASI:",
            error
        );

        screenStream =
            null;

        screenTrack =
            null;

        if (
            error.name !==
            "NotAllowedError"
        ) {

            alert(
                "Ekran paylaşımı başlatılamadı: " +
                error.message
            );

        }

    }

}


async function stopScreenShare() {

    if (!screenStream) {
        return;
    }

    try {

        if (
            videoSender &&
            cameraTrack
        ) {

            await videoSender.replaceTrack(
                cameraTrack
            );

        }

    } catch (error) {

        console.error(
            "KAMERA TRACK GERİ YÜKLEME HATASI:",
            error
        );

    }

    screenStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

    screenStream =
        null;

    screenTrack =
        null;

    sharingScreen =
        false;

    if (localStream) {

        localVideo.srcObject =
            localStream;

    }

    screenButton.textContent =
        "🖥️ Ekran";

}


screenButton.onclick =
    async () => {

        if (sharingScreen) {

            await stopScreenShare();

        } else {

            await startScreenShare();

        }

    };


hangupButton.onclick =
    () => {

        endCall();

    };


function endCall() {

    const target =
        currentTarget;

    if (target) {

        socket.emit(
            "end_call",
            {
                target:
                    target
            }
        );

    }

    cleanupCall();

}


function cleanupCall() {

    if (screenStream) {

        screenStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }

    if (peerConnection) {

        peerConnection.close();

    }

    peerConnection =
        null;

    localStream =
        null;

    screenStream =
        null;

    cameraTrack =
        null;

    screenTrack =
        null;

    videoSender =
        null;

    remoteStream =
        null;

    currentTarget =
        null;

    currentCallType =
        null;

    sharingScreen =
        false;

    pendingCandidates =
        [];

    remoteVideo.srcObject =
        null;

    remoteAudio.srcObject =
        null;

    localVideo.srcObject =
        null;

    remoteVideo.style.display =
        "none";

    remotePlaceholder.style.display =
        "flex";

    callOverlay.classList.remove(
        "show"
    );

    screenButton.style.display =
        "none";

    cameraButton.style.display =
        "none";

    screenButton.textContent =
        "🖥️ Ekran";

    micEnabled =
        true;

    cameraEnabled =
        true;

    micButton.textContent =
        "🎤 Mikrofon";

    cameraButton.textContent =
        "📷 Kamera";

    micButton.classList.remove(
        "disabled"
    );

    cameraButton.classList.remove(
        "disabled"
    );

}


sendButton.onclick =
    () => {

        sendMessage();

    };


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }

    socket.emit(
        "message",
        {
            message:
                message
        }
    );

    messageInput.value =
        "";

}


window.addEventListener(
    "beforeunload",
    () => {

        cleanupCall();

    }
);


cameraButton.style.display =
    "none";

screenButton.style.display =
    "none";

remoteVideo.style.display =
    "none";

</script>

</body>
</html>
