
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Anonim Chat</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            display: flex;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #111118;
            border-right: 1px solid #292933;
            padding: 20px;
            overflow-y: auto;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .username {
            background: #191922;
            border: 1px solid #292933;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .users-title {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #users {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #17171f;
            border: 1px solid #292933;
            padding: 10px;
            border-radius: 10px;
            min-width: 0;
        }

        .user.self {
            opacity: 0.65;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-status {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
        }

        .user-buttons {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .user-buttons button {
            border: 0;
            background: #292934;
            color: white;
            border-radius: 7px;
            padding: 7px;
            cursor: pointer;
        }

        .user-buttons button:hover {
            background: #3b3b49;
        }

        .user-buttons button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .empty {
            color: #666;
            font-size: 13px;
            padding: 10px 0;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 65px;
            flex-shrink: 0;
            background: #111118;
            border-bottom: 1px solid #292933;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            margin-bottom: 14px;
            max-width: 80%;
        }

        .message-user {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .message-text {
            display: inline-block;
            background: #191922;
            border: 1px solid #292933;
            padding: 10px 13px;
            border-radius: 12px;
            word-break: break-word;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #292933;
            background: #111118;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            background: #191922;
            border: 1px solid #292933;
            color: white;
            border-radius: 10px;
            padding: 13px;
            outline: none;
        }

        #sendButton {
            border: 0;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .overlay.show {
            display: flex;
        }

        .call-box {
            width: min(900px, 96vw);
            max-height: 96vh;
            background: #111118;
            border: 1px solid #292933;
            border-radius: 18px;
            padding: 20px;
            overflow-y: auto;
        }

        .call-title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .videos {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        #remoteVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: none;
        }

        #localVideo {
            position: absolute;
            right: 15px;
            bottom: 15px;
            width: 180px;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid white;
            background: #050505;
            z-index: 3;
        }

        #remoteAudio {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #remotePlaceholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 20px;
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .control-button,
        .hangup-button {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }

        .control-button {
            background: #292934;
        }

        .control-button:hover {
