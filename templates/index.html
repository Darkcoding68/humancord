<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>ANONIM — Chat</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            touch-action: manipulation;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 64px;
            min-height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #101010;
            border-bottom: 1px solid #292929;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .username {
            color: #aaa;
            font-size: 14px;
        }

        .main {
            flex: 1;
            min-height: 0;
            display: flex;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: #0d0d0d;
            border-right: 1px solid #292929;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            padding: 18px;
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #userList {
            flex: 1;
            overflow-y: auto;
        }

        .user {
            margin: 5px 10px;
            padding: 12px;
            border-radius: 10px;
            background: #151515;
            cursor: pointer;
            transition: 0.15s;
        }

        .user:hover {
            background: #222;
        }

        .user-name {
            font-weight: 600;
        }

        .user-status {
            margin-top: 4px;
            color: #777;
            font-size: 11px;
        }

        .empty {
            padding: 30px 15px;
            color: #666;
            text-align: center;
            font-size: 13px;
        }

        .chat-area {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 800px;
            margin-bottom: 14px;
        }

        .message-user {
            margin-bottom: 4px;
            color: #777;
            font-size: 12px;
        }

        .message-text {
            display: inline-block;
            padding: 10px 13px;
            background: #151515;
            border: 1px solid #252525;
            border-radius: 12px;
            word-break: break-word;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px;
            background: #0d0d0d;
            border-top: 1px solid #292929;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 13px;
            background: #171717;
            border: 1px solid #292929;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        #messageInput:focus {
            border-color: #555;
        }

        #sendButton {
            padding: 0 20px;
            background: white;
            color: black;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .incoming-call {
            position: fixed;
            left: 50%;
            top: 25px;
            transform: translateX(-50%);
            width: min(400px, calc(100% - 30px));
            z-index: 2000;
            display: none;
            padding: 20px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .incoming-call.active {
            display: block;
        }

        .incoming-title {
            margin-bottom: 5px;
            font-size: 17px;
            font-weight: 700;
        }

        .incoming-text {
            margin-bottom: 18px;
            color: #999;
            font-size: 13px;
        }

        .incoming-buttons {
            display: flex;
            gap: 10px;
        }

        .incoming-buttons button {
            flex: 1;
            height: 42px;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        #acceptCallButton {
            background: white;
            color: black;
        }

        #rejectCallButton {
            background: #272727;
            color: white;
        }

        .call-panel {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            background: #000;
        }

        .call-panel.active {
            display: flex;
        }

        .call-header {
            height: 64px;
            min-height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d0d0d;
            border-bottom: 1px solid #292929;
        }

        .call-title {
            font-weight: 700;
        }

        .call-type {
            margin-top: 3px;
            color: #888;
            font-size: 12px;
        }

        .videos {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #remoteVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #050505;
            display: none;
            z-index: 1;
        }

        #localVideo {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 240px;
            max-width: 30vw;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #111;
            border: 2px solid #444;
            border-radius: 12px;
            display: none;
            z-index: 5;
        }

        .remote-placeholder {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #777;
            pointer-events: none;
        }

        .remote-placeholder-icon {
            margin-bottom: 15px;
            font-size: 60px;
        }

        .remote-placeholder-text {
            font-size: 15px;
            text-align: center;
        }

        .call-controls {
            min-height: 92px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0d0d0d;
            border-top: 1px solid #292929;
        }

        .control-button {
            min-width: 85px;
            height: 60px;
            padding: 5px 10px;
            background: #181818;
            color: white;
            border: 1px solid #303030;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .control-button:hover {
            background: #252525;
        }

        .control-button.active {
            background: #252525;
            border-color: #666;
        }

        .control-button.danger {
            background: #b91c1c;
            border-color: #dc2626;
        }

        .control-button.danger:hover {
            background: #dc2626;
        }

        .control-icon {
            font-size: 20px;
        }

        .control-text {
            font-size: 11px;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 3000;
            padding: 12px 16px;
            background: #171717;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: 0.2s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 700px) {

            .topbar {
                height: 56px;
                min-height: 56px;
                padding: 0 14px;
            }

            .sidebar {
                width: 170px;
                min-width: 170px;
            }

            .sidebar-title {
                padding: 14px 10px;
                font-size: 11px;
            }

            #messages {
                padding: 12px;
            }

            .input-area {
                padding: 8px;
            }

            #sendButton {
                padding: 0 14px;
            }

            #localVideo {
                right: 10px;
                bottom: 10px;
                width: 145px;
                max-width: 42vw;
                border-radius: 9px;
            }

            .call-header {
                height: 55px;
                min-height: 55px;
                padding: 0 12px;
            }

            .call-controls {
                min-height: 82px;
                padding: 8px 5px;
                gap: 5px;
            }

            .control-button {
                min-width: 67px;
                height: 58px;
                padding: 3px;
            }

            .control-icon {
                font-size: 18px;
            }

            .control-text {
                font-size: 9px;
            }

            .remote-placeholder-icon {
                font-size: 45px;
            }

            .remote-placeholder-text {
                padding: 0 20px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="logo">
            ANONIM
        </div>

        <div class="username">
            {{ username }}
        </div>

    </div>


    <div class="main">

        <aside class="sidebar">

            <div class="sidebar-title">
                Çevrimiçi kullanıcılar
            </div>

            <div id="userList">

                <div class="empty">
                    Kullanıcılar yükleniyor...
                </div>

            </div>

        </aside>


        <section class="chat-area">

            <div id="messages"></div>


            <div class="input-area">

                <input
                    id="messageInput"
                    type="text"
                    maxlength="500"
                    placeholder="Mesaj yaz..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    type="button"
                >
                    Gönder
                </button>

            </div>

        </section>

    </div>

</div>


<div
    id="incomingCall"
    class="incoming-call"
>

    <div
        id="incomingTitle"
        class="incoming-title"
    >
        Gelen arama
    </div>


    <div
        id="incomingText"
        class="incoming-text"
    >
        Bir kullanıcı seni arıyor.
    </div>


    <div class="incoming-buttons">

        <button
            id="acceptCallButton"
            type="button"
        >
            Kabul Et
        </button>


        <button
            id="rejectCallButton"
            type="button"
        >
            Reddet
        </button>

    </div>

</div>


<div
    id="callPanel"
    class="call-panel"
>

    <div class="call-header">

        <div>

            <div
                id="callTitle"
                class="call-title"
            >
                Arama
            </div>


            <div
                id="callType"
                class="call-type"
            >
                Video araması
            </div>

        </div>

    </div>


    <div class="videos">

        <div
            id="remotePlaceholder"
            class="remote-placeholder"
        >

            <div class="remote-placeholder-icon">
                👤
            </div>

            <div class="remote-placeholder-text">
                Karşı tarafın görüntüsü bekleniyor...
            </div>

        </div>


        <video
            id="remoteVideo"
            autoplay
            playsinline
            webkit-playsinline
            preload="auto"
        ></video>


        <video
            id="localVideo"
            autoplay
            muted
            playsinline
            webkit-playsinline
        ></video>

    </div>


    <div class="call-controls">

        <button
            id="micButton"
            class="control-button"
            type="button"
        >

            <span class="control-icon">
                🎤
            </span>

            <span
                id="micText"
                class="control-text"
            >
                Mikrofon
            </span>

        </button>


        <button
            id="cameraButton"
            class="control-button"
            type="button"
        >

            <span class="control-icon">
                📷
            </span>

            <span
                id="cameraText"
                class="control-text"
            >
                Kamera
            </span>

        </button>


        <button
            id="screenButton"
            class="control-button"
            type="button"
        >

            <span class="control-icon">
                🖥️
            </span>

            <span class="control-text">
                Ekran
            </span>

        </button>


        <button
            id="endCallButton"
            class="control-button danger"
            type="button"
        >

            <span class="control-icon">
                ☎️
            </span>

            <span class="control-text">
                Kapat
            </span>

        </button>

    </div>

</div>


<audio
    id="remoteAudio"
    autoplay
></audio>


<div
    id="toast"
    class="toast"
></div>


<script>

const socket = io();

const currentUsername = {{ username|tojson }};


const userList =
    document.getElementById("userList");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const incomingCall =
    document.getElementById("incomingCall");

const incomingTitle =
    document.getElementById("incomingTitle");

const incomingText =
    document.getElementById("incomingText");

const acceptCallButton =
    document.getElementById("acceptCallButton");

const rejectCallButton =
    document.getElementById("rejectCallButton");

const callPanel =
    document.getElementById("callPanel");

const callTitle =
    document.getElementById("callTitle");

const callType =
    document.getElementById("callType");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const remoteAudio =
    document.getElementById("remoteAudio");

const remotePlaceholder =
    document.getElementById("remotePlaceholder");

const micButton =
    document.getElementById("micButton");

const micText =
    document.getElementById("micText");

const cameraButton =
    document.getElementById("cameraButton");

const cameraText =
    document.getElementById("cameraText");

const screenButton =
    document.getElementById("screenButton");

const endCallButton =
    document.getElementById("endCallButton");

const toast =
    document.getElementById("toast");


let peerConnection = null;

let localStream = null;

let remoteStream = null;

let pendingCandidates = [];

let currentCallTarget = null;

let currentCallType = null;

let incomingCallData = null;

let microphoneTrack = null;

let cameraTrack = null;

let screenTrack = null;

let audioTransceiver = null;

let videoTransceiver = null;

let videoSender = null;

let isScreenSharing = false;

let micEnabled = true;

let cameraEnabled = true;


const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        }

    ]

};


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}


function addMessage(username, message) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";


    const user =
        document.createElement("div");

    user.className =
        "message-user";

    user.textContent =
        username;


    const text =
        document.createElement("div");

    text.className =
        "message-text";

    text.textContent =
        message;


    wrapper.appendChild(user);

    wrapper.appendChild(text);

    messages.appendChild(wrapper);


    messages.scrollTop =
        messages.scrollHeight;

}


function renderUsers(users) {

    userList.innerHTML = "";


    const filtered =
        users.filter(user => {

            return user.username !==
                currentUsername;

        });


    if (filtered.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty";

        empty.textContent =
            "Başka kullanıcı yok.";

        userList.appendChild(empty);

        return;

    }


    filtered.forEach(user => {

        const element =
            document.createElement("div");

        element.className =
            "user";


        const name =
            document.createElement("div");

        name.className =
            "user-name";

        name.textContent =
            user.username;


        const status =
            document.createElement("div");

        status.className =
            "user-status";

        status.textContent =
            "Çevrimiçi";


        element.appendChild(name);

        element.appendChild(status);


        element.addEventListener(
            "click",
            () => {

                if (peerConnection) {

                    showToast(
                        "Zaten bir aramadasın."
                    );

                    return;

                }


                startCall(
                    user.sid,
                    "video"
                );

            }
        );


        userList.appendChild(element);

    });

}


socket.on(
    "connect",
    () => {

        console.log(
            "SOCKET CONNECTED:",
            socket.id
        );

    }
);


socket.on(
    "disconnect",
    () => {

        console.log(
            "SOCKET DISCONNECTED"
        );

    }
);


socket.on(
    "user_list",
    users => {

        renderUsers(users);

    }
);


socket.on(
    "message",
    data => {

        addMessage(
            data.username,
            data.message
        );

    }
);


function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    socket.emit(
        "message",
        {
            message: message
        }
    );


    messageInput.value =
        "";

    messageInput.focus();

}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


async function getMedia(video) {

    const audioConstraints = {

        echoCancellation: true,

        noiseSuppression: true,

        autoGainControl: true

    };


    if (!video) {

        return await navigator.mediaDevices.getUserMedia({

            audio: audioConstraints,

            video: false

        });

    }


    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                audio: audioConstraints,

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30
                    }

                }

            });


        console.log(
            "KAMERA + MIKROFON ALINDI"
        );


        console.log(
            "VIDEO TRACK:",
            stream.getVideoTracks()
        );


        return stream;

    } catch (error) {

        console.warn(
            "Kamera alınamadı:",
            error
        );


        showToast(
            "Kamera açılamadı, ses ile devam ediliyor."
        );


        const audioOnly =
            await navigator.mediaDevices.getUserMedia({

                audio: audioConstraints,

                video: false

            });


        return audioOnly;

    }

}


function createPeerConnection() {

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    pendingCandidates =
        [];


    peerConnection.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }


            if (!currentCallTarget) {
                return;
            }


            socket.emit(
                "ice_candidate",
                {

                    target:
                        currentCallTarget,

                    candidate:
                        event.candidate

                }
            );

        };


    peerConnection.onconnectionstatechange =
        () => {

            console.log(
                "CONNECTION:",
                peerConnection.connectionState
            );


            if (
                peerConnection.connectionState ===
                "failed"
            ) {

                showToast(
                    "WebRTC bağlantısı başarısız."
                );

            }

        };


    peerConnection.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                peerConnection.iceConnectionState
            );

        };


    peerConnection.ontrack =
        event => {

            console.log(
                "REMOTE TRACK:",
                event.track.kind
            );


            if (
                !remoteStream
                    .getTracks()
                    .some(track =>
                        track.id ===
                        event.track.id
                    )
            ) {

                remoteStream.addTrack(
                    event.track
                );

            }


            console.log(
                "REMOTE STREAM TRACKS:",
                remoteStream
                    .getTracks()
                    .map(track =>
                        track.kind
                    )
            );


            if (
                event.track.kind ===
                "video"
            ) {

                console.log(
                    "UZAK VIDEO GELDI"
                );


                remoteVideo.srcObject =
                    remoteStream;


                remoteVideo.style.display =
                    "block";


                remotePlaceholder.style.display =
                    "none";


                remoteVideo.muted =
                    false;


                remoteVideo.setAttribute(
                    "autoplay",
                    ""
                );


                remoteVideo.setAttribute(
                    "playsinline",
                    ""
                );


                remoteVideo.setAttribute(
                    "webkit-playsinline",
                    ""
                );


                const playRemoteVideo =
                    async () => {

                        try {

                            await remoteVideo.play();


                            console.log(
                                "REMOTE VIDEO OYNUYOR"
                            );

                        } catch (error) {

                            console.error(
                                "REMOTE VIDEO PLAY HATASI:",
                                error
                            );

                            showToast(
                                "Video oynatılamadı."
                            );

                        }

                    };


                playRemoteVideo();


                event.track.onunmute =
                    () => {

                        console.log(
                            "REMOTE VIDEO UNMUTE"
                        );


                        remoteVideo.play()
                            .catch(() => {});

                    };


                event.track.onmute =
                    () => {

                        console.log(
                            "REMOTE VIDEO MUTE"
                        );

                    };

            }


            if (
                event.track.kind ===
                "audio"
            ) {

                remoteAudio.srcObject =
                    remoteStream;


                remoteAudio.play()
                    .then(() => {

                        console.log(
                            "REMOTE AUDIO OYNUYOR"
                        );

                    })
                    .catch(error => {

                        console.error(
                            "REMOTE AUDIO PLAY HATASI:",
                            error
                        );

                    });

            }

        };


    const localAudioTrack =
        localStream
            ? localStream.getAudioTracks()[0]
            : null;


    audioTransceiver =
        peerConnection.addTransceiver(
            "audio",
            {

                direction:
                    localAudioTrack
                        ? "sendrecv"
                        : "recvonly"

            }
        );


    if (localAudioTrack) {

        audioTransceiver.sender.replaceTrack(
            localAudioTrack
        );


        microphoneTrack =
            localAudioTrack;

    }


    if (
        currentCallType ===
        "video"
    ) {

        const localVideoTrack =
            localStream
                ? localStream.getVideoTracks()[0]
                : null;


        videoTransceiver =
            peerConnection.addTransceiver(
                "video",
                {

                    direction:
                        localVideoTrack
                            ? "sendrecv"
                            : "recvonly"

                }
            );


        videoSender =
            videoTransceiver.sender;


        if (localVideoTrack) {

            videoSender.replaceTrack(
                localVideoTrack
            );


            cameraTrack =
                localVideoTrack;

        }


        console.log(
            "VIDEO TRANSCEIVER:",
            videoTransceiver
        );

    }


    console.log(
        "AUDIO TRANSCEIVER:",
        audioTransceiver
    );


    console.log(
        "VIDEO SENDER:",
        videoSender
    );

}


async function flushPendingCandidates() {

    if (!peerConnection) {
        return;
    }


    if (
        !peerConnection.remoteDescription
    ) {

        return;

    }


    for (
        const candidate
        of pendingCandidates
    ) {

        try {

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (error) {

            console.error(
                "ICE CANDIDATE HATASI:",
                error
            );

        }

    }


    pendingCandidates =
        [];

}


function openCallPanel(
    username,
    type
) {

    callPanel.classList.add(
        "active"
    );


    callTitle.textContent =
        username;


    currentCallType =
        type;


    if (
        type ===
        "video"
    ) {

        callType.textContent =
            "Video araması";


        remotePlaceholder.style.display =
            "flex";


        remoteVideo.style.display =
            "none";


        screenButton.style.display =
            "flex";


        cameraButton.style.display =
            cameraTrack
                ? "flex"
                : "none";


        localVideo.style.display =
            cameraTrack
                ? "block"
                : "none";

    } else {

        callType.textContent =
            "Sesli arama";


        remoteVideo.style.display =
            "none";


        localVideo.style.display =
            "none";


        remotePlaceholder.style.display =
            "flex";


        screenButton.style.display =
            "none";


        cameraButton.style.display =
            "none";

    }


    micButton.style.display =
        microphoneTrack
            ? "flex"
            : "none";


    updateButtons();

}


function updateButtons() {

    if (microphoneTrack) {

        micText.textContent =
            micEnabled
                ? "Mikrofon"
                : "Mikrofon Kapalı";


        micButton.classList.toggle(
            "active",
            !micEnabled
        );

    }


    if (cameraTrack) {

        cameraText.textContent =
            cameraEnabled
                ? "Kamera"
                : "Kamera Kapalı";


        cameraButton.classList.toggle(
            "active",
            !cameraEnabled
        );

    }

}


async function startCall(
    target,
    type
) {

    if (peerConnection) {

        showToast(
            "Zaten aramadasın."
        );

        return;

    }


    currentCallTarget =
        target;


    currentCallType =
        type;


    try {

        localStream =
            await getMedia(
                type ===
                "video"
            );


        microphoneTrack =
            localStream
                .getAudioTracks()[0]
                || null;


        cameraTrack =
            localStream
                .getVideoTracks()[0]
                || null;


        micEnabled =
            true;


        cameraEnabled =
            true;


        createPeerConnection();


        if (cameraTrack) {

            localVideo.srcObject =
                localStream;


            localVideo.style.display =
                "block";

        } else {

            localVideo.srcObject =
                null;


            localVideo.style.display =
                "none";

        }


        openCallPanel(
            "Arama",
            type
        );


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        console.log(
            "LOCAL OFFER:",
            offer
        );


        socket.emit(
            "call_user",
            {

                target:
                    target,

                offer:
                    offer,

                type:
                    type

            }
        );


        console.log(
            "ARAMA GÖNDERİLDİ"
        );

    } catch (error) {

        console.error(
            "ARAMA HATASI:",
            error
        );


        showToast(
            "Arama başlatılamadı: " +
            error.message
        );


        cleanupCall();

    }

}


socket.on(
    "incoming_call",
    data => {

        console.log(
            "GELEN ARAMA:",
            data
        );


        if (peerConnection) {

            socket.emit(
                "reject_call",
                {
                    target:
                        data.from
                }
            );

            return;

        }


        incomingCallData =
            data;


        incomingTitle.textContent =
            data.username +
            " arıyor";


        incomingText.textContent =
            data.type ===
            "video"
                ? "Video araması geliyor."
                : "Sesli arama geliyor.";


        incomingCall.classList.add(
            "active"
        );

    }
);


acceptCallButton.addEventListener(
    "click",
    async () => {

        if (!incomingCallData) {
            return;
        }


        const data =
            incomingCallData;


        incomingCallData =
            null;


        incomingCall.classList.remove(
            "active"
        );


        currentCallTarget =
            data.from;


        currentCallType =
            data.type;


        try {

            localStream =
                await getMedia(
                    data.type ===
                    "video"
                );


            microphoneTrack =
                localStream
                    .getAudioTracks()[0]
                    || null;


            cameraTrack =
                localStream
                    .getVideoTracks()[0]
                    || null;


            micEnabled =
                true;


            cameraEnabled =
                true;


            createPeerConnection();


            if (cameraTrack) {

                localVideo.srcObject =
                    localStream;


                localVideo.style.display =
                    "block";

            } else {

                localVideo.srcObject =
                    null;


                localVideo.style.display =
                    "none";

            }


            openCallPanel(
                data.username,
                data.type
            );


            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


            console.log(
                "REMOTE DESCRIPTION AYARLANDI"
            );


            await flushPendingCandidates();


            const answer =
                await peerConnection.createAnswer();


            await peerConnection.setLocalDescription(
                answer
            );


            console.log(
                "LOCAL ANSWER:",
                answer
            );


            socket.emit(
                "answer_call",
                {

                    target:
                        data.from,

                    answer:
                        answer

                }
            );


            console.log(
                "ARAMA KABUL EDİLDİ"
            );

        } catch (error) {

            console.error(
                "ARAMA KABUL HATASI:",
                error
            );


            showToast(
                "Arama açılamadı: " +
                error.message
            );


            cleanupCall();

        }

    }
);


rejectCallButton.addEventListener(
    "click",
    () => {

        if (!incomingCallData) {
            return;
        }


        socket.emit(
            "reject_call",
            {

                target:
                    incomingCallData.from

            }
        );


        incomingCallData =
            null;


        incomingCall.classList.remove(
            "active"
        );

    }
);


socket.on(
    "call_answered",
    async data => {

        if (!peerConnection) {
            return;
        }


        try {

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );


            console.log(
                "ANSWER ALINDI"
            );


            await flushPendingCandidates();

        } catch (error) {

            console.error(
                "ANSWER HATASI:",
                error
            );

        }

    }
);


socket.on(
    "ice_candidate",
    async data => {

        if (!peerConnection) {
            return;
        }


        if (
            !peerConnection.remoteDescription
        ) {

            pendingCandidates.push(
                data.candidate
            );

            return;

        }


        try {

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

        } catch (error) {

            console.error(
                "ICE HATASI:",
                error
            );

        }

    }
);


socket.on(
    "call_rejected",
    () => {

        showToast(
            "Arama reddedildi."
        );


        cleanupCall();

    }
);


socket.on(
    "call_busy",
    data => {

        showToast(
            data.message ||
            "Kullanıcı meşgul."
        );


        cleanupCall();

    }
);


socket.on(
    "call_ended",
    () => {

        showToast(
            "Arama sona erdi."
        );


        cleanupCall();

    }
);


micButton.addEventListener(
    "click",
    () => {

        if (!microphoneTrack) {
            return;
        }


        micEnabled =
            !micEnabled;


        microphoneTrack.enabled =
            micEnabled;


        updateButtons();

    }
);


cameraButton.addEventListener(
    "click",
    () => {

        if (!cameraTrack) {
            return;
        }


        cameraEnabled =
            !cameraEnabled;


        cameraTrack.enabled =
            cameraEnabled;


        updateButtons();

    }
);


async function startScreenShare() {

    if (!peerConnection) {

        showToast(
            "Aktif arama yok."
        );

        return;

    }


    if (
        currentCallType !==
        "video"
    ) {

        showToast(
            "Ekran paylaşımı video aramasında kullanılabilir."
        );

        return;

    }


    if (isScreenSharing) {
        return;
    }


    try {

        console.log(
            "EKRAN PAYLAŞIMI BAŞLATILIYOR"
        );


        const displayStream =
            await navigator.mediaDevices.getDisplayMedia({

                video: true,

                audio: false

            });


        screenTrack =
            displayStream.getVideoTracks()[0];


        if (!videoSender) {

            throw new Error(
                "Video sender bulunamadı."
            );

        }


        await videoSender.replaceTrack(
            screenTrack
        );


        isScreenSharing =
            true;


        screenTrack.onended =
            async () => {

                await stopScreenShare();

            };


        screenButton.classList.add(
            "active"
        );


        console.log(
            "EKRAN PAYLAŞIMI BAŞLADI"
        );

    } catch (error) {

        console.error(
            "EKRAN PAYLAŞIMI HATASI:",
            error
        );


        showToast(
            "Ekran paylaşımı başlatılamadı."
        );

    }

}


async function stopScreenShare() {

    if (!isScreenSharing) {
        return;
    }


    console.log(
        "EKRAN PAYLAŞIMI DURDURULUYOR"
    );


    try {

        if (videoSender) {

            await videoSender.replaceTrack(
                cameraTrack || null
            );

        }

    } catch (error) {

        console.error(
            "VIDEO TRACK DEĞİŞTİRME HATASI:",
            error
        );

    }


    if (screenTrack) {

        try {
            screenTrack.stop();
        } catch (error) {}

        screenTrack =
            null;

    }


    isScreenSharing =
        false;


    screenButton.classList.remove(
        "active"
    );


    console.log(
        "EKRAN PAYLAŞIMI DURDU"
    );

}


screenButton.addEventListener(
    "click",
    async () => {

        console.log(
            "EKRAN BUTONUNA BASILDI"
        );


        if (isScreenSharing) {

            await stopScreenShare();

        } else {

            await startScreenShare();

        }

    }
);


endCallButton.addEventListener(
    "click",
    () => {

        if (currentCallTarget) {

            socket.emit(
                "end_call",
                {

                    target:
                        currentCallTarget

                }
            );

        }


        cleanupCall();

    }
);


function cleanupCall() {

    console.log(
        "CALL CLEANUP"
    );


    if (screenTrack) {

        try {
            screenTrack.stop();
        } catch (error) {}

        screenTrack =
            null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                try {
                    track.stop();
                } catch (error) {}

            });

    }


    localStream =
        null;


    if (peerConnection) {

        try {

            peerConnection.ontrack =
                null;

            peerConnection.onicecandidate =
                null;

            peerConnection.close();

        } catch (error) {}

    }


    peerConnection =
        null;


    remoteStream =
        null;


    microphoneTrack =
        null;


    cameraTrack =
        null;


    videoSender =
        null;


    videoTransceiver =
        null;


    audioTransceiver =
        null;


    pendingCandidates =
        [];


    currentCallTarget =
        null;


    currentCallType =
        null;


    isScreenSharing =
        false;


    micEnabled =
        true;


    cameraEnabled =
        true;


    localVideo.srcObject =
        null;


    remoteVideo.srcObject =
        null;


    remoteAudio.srcObject =
        null;


    localVideo.style.display =
        "none";


    remoteVideo.style.display =
        "none";


    remotePlaceholder.style.display =
        "flex";


    callPanel.classList.remove(
        "active"
    );


    screenButton.classList.remove(
        "active"
    );


    cameraButton.classList.remove(
        "active"
    );


    micButton.classList.remove(
        "active"
    );


    incomingCallData =
        null;


    incomingCall.classList.remove(
        "active"
    );

}


remoteVideo.addEventListener(
    "loadedmetadata",
    async () => {

        console.log(
            "REMOTE VIDEO METADATA HAZIR"
        );


        try {

            await remoteVideo.play();


            console.log(
                "REMOTE VIDEO PLAY BAŞARILI"
            );

        } catch (error) {

            console.error(
                "REMOTE VIDEO PLAY HATASI:",
                error
            );

        }

    }
);


remoteVideo.addEventListener(
    "canplay",
    () => {

        console.log(
            "REMOTE VIDEO CANPLAY"
        );


        remoteVideo.play()
            .catch(error => {

                console.error(
                    "CANPLAY PLAY HATASI:",
                    error
                );

            });

    }
);


remoteVideo.addEventListener(
    "playing",
    () => {

        console.log(
            "REMOTE VIDEO GERÇEKTEN OYNUYOR"
        );

        remotePlaceholder.style.display =
            "none";

    }
);


remoteVideo.addEventListener(
    "error",
    event => {

        console.error(
            "REMOTE VIDEO ERROR:",
            event
        );

    }
);


screenButton.style.display =
    "none";


cameraButton.style.display =
    "none";


micButton.style.display =
    "none";

</script>

</body>
</html>
