<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Anonim Chat</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            display: flex;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #111118;
            border-right: 1px solid #292933;
            padding: 20px;
            overflow-y: auto;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .username {
            background: #191922;
            border: 1px solid #292933;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .users-title {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #users {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #17171f;
            border: 1px solid #292933;
            padding: 10px;
            border-radius: 10px;
            min-width: 0;
        }

        .user.self {
            opacity: 0.65;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-status {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
        }

        .user-buttons {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .user-buttons button {
            border: 0;
            background: #292934;
            color: white;
            border-radius: 7px;
            padding: 7px;
            cursor: pointer;
        }

        .user-buttons button:hover {
            background: #3b3b49;
        }

        .user-buttons button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .empty {
            color: #666;
            font-size: 13px;
            padding: 10px 0;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 65px;
            flex-shrink: 0;
            background: #111118;
            border-bottom: 1px solid #292933;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            margin-bottom: 14px;
            max-width: 80%;
        }

        .message-user {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .message-text {
            display: inline-block;
            background: #191922;
            border: 1px solid #292933;
            padding: 10px 13px;
            border-radius: 12px;
            word-break: break-word;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #292933;
            background: #111118;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            background: #191922;
            border: 1px solid #292933;
            color: white;
            border-radius: 10px;
            padding: 13px;
            outline: none;
        }

        #sendButton {
            border: 0;
            background: #5865f2;
            color: white;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .overlay.show {
            display: flex;
        }

        .call-box {
            width: min(900px, 96vw);
            max-height: 96vh;
            background: #111118;
            border: 1px solid #292933;
            border-radius: 18px;
            padding: 20px;
            overflow-y: auto;
        }

        .call-title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .videos {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        #remoteVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: none;
        }

        #localVideo {
            position: absolute;
            right: 15px;
            bottom: 15px;
            width: 180px;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid white;
            background: #050505;
            z-index: 3;
        }

        #remoteAudio {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #remotePlaceholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 20px;
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .control-button,
        .hangup-button {
            border: 0;
            border-radius: 10px;
            padding: 12px 17px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }

        .control-button {
            background: #292934;
        }

        .control-button:hover {
            background: #3b3b49;
        }

        .control-button.off {
            background: #4a3030;
        }

        .control-button.off:hover {
            background: #5c3a3a;
        }

        .hangup-button {
            background: #e5484d;
        }

        .hangup-button:hover {
            background: #c9393e;
        }

        .incoming-text {
            text-align: center;
            font-size: 16px;
            margin-bottom: 10px;
            color: #ddd;
        }

        @media (max-width: 720px) {
            .sidebar {
                width: 220px;
                padding: 15px;
            }

            #localVideo {
                width: 120px;
                right: 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo">ANONIM</div>

        <div class="username">@{{ username }}</div>

        <div class="users-title">ÇEVRİMİÇİ KULLANICILAR</div>
        <div id="users">
            <div class="empty">Kimse yok...</div>
        </div>
    </aside>

    <main class="main">
        <div class="header">Genel Sohbet</div>

        <div id="messages"></div>

        <div class="input-area">
            <input type="text" id="messageInput" maxlength="500" autocomplete="off" placeholder="Bir mesaj yaz...">
            <button id="sendButton">Gönder</button>
        </div>
    </main>
</div>

<!-- Gelen arama bildirimi -->
<div class="overlay" id="incomingOverlay">
    <div class="call-box">
        <div class="call-title">Gelen Arama</div>
        <div class="incoming-text" id="incomingText"></div>
        <div class="controls">
            <button class="control-button" id="acceptCallBtn">Kabul Et</button>
            <button class="hangup-button" id="rejectCallBtn">Reddet</button>
        </div>
    </div>
</div>

<!-- Aktif arama ekranı -->
<div class="overlay" id="callOverlay">
    <div class="call-box">
        <div class="call-title" id="callTitle">Arama</div>

        <div class="videos">
            <video id="remoteVideo" autoplay playsinline></video>
            <audio id="remoteAudio" autoplay></audio>
            <div id="remotePlaceholder">Bağlanıyor...</div>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="controls">
            <button class="control-button" id="micButton">🎤 Mikrofon</button>
            <button class="control-button" id="camButton">📷 Kamera</button>
            <button class="hangup-button" id="hangupButton">Aramayı Bitir</button>
        </div>
    </div>
</div>

<script>
    const myUsername = {{ username | tojson }};
    const socket = io();

    const ICE_SERVERS = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    let knownUsers = [];
    let peerConnection = null;
    let localStream = null;
    let callPeerSid = null;
    let pendingIncomingCall = null;
    let queuedIceCandidates = [];
    let micOn = true;
    let camOn = true;

    const usersEl = document.getElementById("users");
    const messagesEl = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    const incomingOverlay = document.getElementById("incomingOverlay");
    const incomingText = document.getElementById("incomingText");
    const acceptCallBtn = document.getElementById("acceptCallBtn");
    const rejectCallBtn = document.getElementById("rejectCallBtn");

    const callOverlay = document.getElementById("callOverlay");
    const callTitle = document.getElementById("callTitle");
    const remoteVideo = document.getElementById("remoteVideo");
    const remoteAudio = document.getElementById("remoteAudio");
    const remotePlaceholder = document.getElementById("remotePlaceholder");
    const localVideo = document.getElementById("localVideo");
    const micButton = document.getElementById("micButton");
    const camButton = document.getElementById("camButton");
    const hangupButton = document.getElementById("hangupButton");

    // ---------- Kullanıcı listesi ----------

    function renderUsers() {
        const others = knownUsers.filter((u) => u.sid !== socket.id);

        if (others.length === 0) {
            usersEl.innerHTML = '<div class="empty">Kimse yok...</div>';
            return;
        }

        usersEl.innerHTML = "";

        others.forEach((u) => {
            const busy = !!callPeerSid;

            const row = document.createElement("div");
            row.className = "user";

            const info = document.createElement("div");
            info.className = "user-info";

            const name = document.createElement("div");
            name.className = "user-name";
            name.textContent = "@" + u.username;

            const status = document.createElement("div");
            status.className = "user-status";
            status.textContent = "Çevrimiçi";

            info.appendChild(name);
            info.appendChild(status);

            const buttons = document.createElement("div");
            buttons.className = "user-buttons";

            const audioBtn = document.createElement("button");
            audioBtn.textContent = "📞";
            audioBtn.title = "Sesli ara";
            audioBtn.disabled = busy;
            audioBtn.addEventListener("click", () => startCall(u.sid, false));

            const videoBtn = document.createElement("button");
            videoBtn.textContent = "🎥";
            videoBtn.title = "Görüntülü ara";
            videoBtn.disabled = busy;
            videoBtn.addEventListener("click", () => startCall(u.sid, true));

            buttons.appendChild(audioBtn);
            buttons.appendChild(videoBtn);

            row.appendChild(info);
            row.appendChild(buttons);
            usersEl.appendChild(row);
        });
    }

    socket.on("user_list", (list) => {
        knownUsers = list;
        renderUsers();
    });

    // ---------- Mesajlaşma ----------

    function appendMessage(username, text) {
        const isSelf = username === myUsername;

        const wrap = document.createElement("div");
        wrap.className = "message";

        const who = document.createElement("div");
        who.className = "message-user";
        who.textContent = isSelf ? "Sen" : "@" + username;

        const body = document.createElement("div");
        body.className = "message-text";
        body.textContent = text;

        wrap.appendChild(who);
        wrap.appendChild(body);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    socket.on("message", (data) => {
        appendMessage(data.username, data.message);
    });

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        socket.emit("message", { message: text });
        messageInput.value = "";
    }

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });

    // ---------- WebRTC arama ----------

    function setupPeerConnection() {
        peerConnection = new RTCPeerConnection(ICE_SERVERS);

        peerConnection.onicecandidate = (event) => {
            if (event.candidate && callPeerSid) {
                socket.emit("ice_candidate", {
                    target: callPeerSid,
                    candidate: event.candidate
                });
            }
        };

        peerConnection.ontrack = (event) => {
            if (event.track.kind === "video") {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = "block";
                remotePlaceholder.style.display = "none";
            } else {
                remoteAudio.srcObject = event.streams[0];
            }
        };

        peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === "connected") {
                // Video track varsa placeholder zaten ontrack ile gizlendi.
                // Sesli aramada video hiç gelmeyeceği için yazıyı burada güncelliyoruz.
                if (remoteVideo.style.display !== "block") {
                    remotePlaceholder.textContent = "Bağlandı";
                }
            } else if (
                peerConnection.connectionState === "failed" ||
                peerConnection.connectionState === "disconnected"
            ) {
                remotePlaceholder.textContent = "Bağlantı koptu...";
            }
        };
    }

    function openCallOverlay(withVideo) {
        callTitle.textContent = withVideo ? "Görüntülü Arama" : "Sesli Arama";
        remoteVideo.style.display = "none";
        remotePlaceholder.style.display = "flex";
        remotePlaceholder.textContent = "Bağlanıyor...";
        localVideo.style.display = withVideo ? "block" : "none";
        callOverlay.classList.add("show");
    }

    async function startCall(targetSid, withVideo) {
        if (callPeerSid) return;

        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: withVideo
            });
        } catch (err) {
            alert("Kameraya/mikrofona erişilemedi: " + err.message);
            return;
        }

        callPeerSid = targetSid;
        setupPeerConnection();

        localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
        });
        localVideo.srcObject = localStream;

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit("call_user", { target: targetSid, offer });

        openCallOverlay(withVideo);
        renderUsers();
    }

    socket.on("incoming_call", (data) => {
        if (callPeerSid) {
            socket.emit("reject_call", { target: data.from });
            return;
        }

        pendingIncomingCall = data;
        incomingText.textContent = "@" + data.username + " seni arıyor...";
        incomingOverlay.classList.add("show");
    });

    acceptCallBtn.addEventListener("click", async () => {
        if (!pendingIncomingCall) return;

        const call = pendingIncomingCall;
        pendingIncomingCall = null;
        incomingOverlay.classList.remove("show");

        const withVideo = !!(call.offer && call.offer.sdp && call.offer.sdp.includes("m=video"));

        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: withVideo
            });
        } catch (err) {
            alert("Kameraya/mikrofona erişilemedi: " + err.message);
            socket.emit("reject_call", { target: call.from });
            return;
        }

        callPeerSid = call.from;
        setupPeerConnection();

        localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
        });
        localVideo.srcObject = localStream;

        await peerConnection.setRemoteDescription(new RTCSessionDescription(call.offer));

        // Kabul'e basılmadan önce kuyruğa alınmış ICE candidate'ları şimdi ekle.
        for (const candidate of queuedIceCandidates) {
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (err) {
                console.error("Kuyruktaki ICE candidate eklenemedi:", err);
            }
        }
        queuedIceCandidates = [];

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit("answer_call", { target: call.from, answer });

        openCallOverlay(withVideo);
        renderUsers();
    });

    rejectCallBtn.addEventListener("click", () => {
        if (!pendingIncomingCall) return;

        socket.emit("reject_call", { target: pendingIncomingCall.from });
        pendingIncomingCall = null;
        incomingOverlay.classList.remove("show");
    });

    socket.on("call_answered", async (data) => {
        if (!peerConnection || callPeerSid !== data.from) return;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on("ice_candidate", async (data) => {
        if (!peerConnection) {
            // Karşı taraf henüz "Kabul Et"e basmadıysa peerConnection henüz yok.
            // Candidate'ı kaybetmemek için kabul edilene kadar kuyruğa alıyoruz.
            queuedIceCandidates.push(data.candidate);
            return;
        }

        try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (err) {
            console.error("ICE candidate eklenemedi:", err);
        }
    });

    socket.on("call_busy", (data) => {
        alert(data.message || "Kullanıcı meşgul.");
        endCallLocally();
    });

    socket.on("call_rejected", () => {
        alert("Arama reddedildi.");
        endCallLocally();
    });

    socket.on("call_ended", () => {
        endCallLocally();
    });

    hangupButton.addEventListener("click", () => {
        if (callPeerSid) {
            socket.emit("end_call", { target: callPeerSid });
        }
        endCallLocally();
    });

    function endCallLocally() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }

        if (localStream) {
            localStream.getTracks().forEach((t) => t.stop());
            localStream = null;
        }

        callPeerSid = null;
        queuedIceCandidates = [];
        micOn = true;
        camOn = true;

        micButton.textContent = "🎤 Mikrofon";
        micButton.classList.remove("off");
        camButton.textContent = "📷 Kamera";
        camButton.classList.remove("off");

        remoteVideo.srcObject = null;
        remoteAudio.srcObject = null;
        localVideo.srcObject = null;

        callOverlay.classList.remove("show");
        renderUsers();
    }

    micButton.addEventListener("click", () => {
        if (!localStream) return;

        micOn = !micOn;
        localStream.getAudioTracks().forEach((t) => (t.enabled = micOn));
        micButton.textContent = micOn ? "🎤 Mikrofon" : "🔇 Mikrofon Kapalı";
        micButton.classList.toggle("off", !micOn);
    });

    camButton.addEventListener("click", () => {
        if (!localStream) return;

        camOn = !camOn;
        localStream.getVideoTracks().forEach((t) => (t.enabled = camOn));
        camButton.textContent = camOn ? "📷 Kamera" : "📷 Kamera Kapalı";
        camButton.classList.toggle("off", !camOn);
    });

    socket.on("disconnect", () => {
        appendMessage("Sistem", "Bağlantı koptu, sayfayı yenilemen gerekebilir.");
    });
</script>

</body>
</html>
